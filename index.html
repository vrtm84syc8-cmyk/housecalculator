<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mortgage Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        form {
            display: grid;
            gap: 12px;
            max-width: 400px;
        }

        label {
            display: grid;
            gap: 4px;
        }

        input, button {
            font-size: 1rem;
            padding: 8px;
        }

        button {
            cursor: pointer;
        }

        #results {
            margin-top: 24px;
            padding: 16px;
            background: #f1f5f9;
        }

        #rayProductions {
            margin-top: 48px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Mortgage Calculator</h1>
    <p>Enter your numbers to estimate your monthly and upfront costs.</p>

    <form id="mortgageForm">
        <label>
            Home price ($)
            <input id="homePrice" type="number" min="0" step="0.01" required>
        </label>
        <label>
            Down payment (%)
            <input id="downPaymentPercent" type="number" min="0" max="100" step="0.01" required>
        </label>
        <label>
            Mortgage interest rate (annual %)
            <input id="interestRate" type="number" min="0" step="0.01" required>
        </label>
        <label>
            Loan term (years)
            <input id="loanTerm" type="number" min="1" step="1" required>
        </label>
        <label>
            Property tax (annual % of home price)
            <input id="propertyTaxRate" type="number" min="0" step="0.01" value="1.2" required>
        </label>
        <label>
            Home insurance (annual $)
            <input id="homeInsurance" type="number" min="0" step="0.01" value="1200" required>
        </label>
        <label>
            HOA fees (monthly $)
            <input id="hoaFees" type="number" min="0" step="0.01" value="0" required>
        </label>
        <label>
            Closing costs (upfront % of home price)
            <input id="closingCostPercent" type="number" min="0" step="0.01" value="3" required>
        </label>
        <button type="submit">Calculate</button>
    </form>

    <section id="results" aria-live="polite">
        <h2>Results</h2>
        <p>Enter your information and click Calculate.</p>
    </section>

    <p id="rayProductions">RayProductions</p>

    <script>
        const form = document.querySelector('#mortgageForm');
        const results = document.querySelector('#results');

        function money(amount) {
            return amount.toLocaleString('en-US', {
                style: 'currency',
                currency: 'USD'
            });
        }

        function calculateMortgage(event) {
            event.preventDefault();

            const homePrice = Number(document.querySelector('#homePrice').value);
            const downPaymentPercent = Number(document.querySelector('#downPaymentPercent').value);
            const annualInterestRate = Number(document.querySelector('#interestRate').value);
            const loanTermYears = Number(document.querySelector('#loanTerm').value);
            const propertyTaxRate = Number(document.querySelector('#propertyTaxRate').value);
            const annualInsurance = Number(document.querySelector('#homeInsurance').value);
            const monthlyHoa = Number(document.querySelector('#hoaFees').value);
            const closingCostPercent = Number(document.querySelector('#closingCostPercent').value);

            const downPayment = homePrice * (downPaymentPercent / 100);
            const loanAmount = homePrice - downPayment;
            const monthlyInterestRate = annualInterestRate / 100 / 12;
            const numberOfPayments = loanTermYears * 12;

            let monthlyMortgage = 0;
            if (loanAmount > 0 && monthlyInterestRate > 0) {
                monthlyMortgage = loanAmount * (
                    monthlyInterestRate * Math.pow(1 + monthlyInterestRate, numberOfPayments)
                ) / (
                    Math.pow(1 + monthlyInterestRate, numberOfPayments) - 1
                );
            } else if (loanAmount > 0) {
                monthlyMortgage = loanAmount / numberOfPayments;
            }

            const monthlyTaxes = (homePrice * (propertyTaxRate / 100)) / 12;
            const monthlyInsurance = annualInsurance / 12;
            const totalMonthlyCost = monthlyMortgage + monthlyTaxes + monthlyInsurance + monthlyHoa;
            const closingCosts = homePrice * (closingCostPercent / 100);
            const totalUpfrontCost = downPayment + closingCosts;

            results.innerHTML = `
                <h2>Results</h2>
                <p>Down payment: <strong>${money(downPayment)}</strong></p>
                <p>Loan amount: <strong>${money(loanAmount)}</strong></p>
                <p>Monthly mortgage: <strong>${money(monthlyMortgage)}</strong></p>
                <p>Monthly taxes: <strong>${money(monthlyTaxes)}</strong></p>
                <p>Total monthly cost: <strong>${money(totalMonthlyCost)}</strong></p>
                <p>Closing costs: <strong>${money(closingCosts)}</strong></p>
                <p>Total upfront cost: <strong>${money(totalUpfrontCost)}</strong></p>
            `;
        }

        form.addEventListener('submit', calculateMortgage);
    </script>
</body>
</html>
